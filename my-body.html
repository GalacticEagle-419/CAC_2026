<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Body</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --accent: #34d399;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header a {
      font-size: 24px;
      text-decoration: none;
      color: var(--text-dark);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-dark);
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-group input[type="number"] {
      width: 70px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
    }
    .input-group span {
      font-size: 14px;
      color: var(--text-light);
    }

    .sex-buttons {
      display: flex;
      gap: 10px;
    }
    .sex-button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: #f3f4f6;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s;
    }
    .sex-button:hover {
      background: #e5e7eb;
    }
    .sex-button.selected {
      background: var(--accent);
      color: white;
      border: none;
    }

    .enter-conditions-button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      transition: background 0.2s;
    }
    .enter-conditions-button:hover {
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html">🏠</a>
      <a href="#" onclick="history.back()">←</a>
    </div>
    <h2>My Body</h2>
    <form>
      <div class="form-group">
        <label for="height-ft">Height</label>
        <div class="input-group">
          <input type="number" id="height-ft" placeholder="ft">
          <span>ft</span>
          <input type="number" id="height-in" placeholder="in">
          <span>in</span>
        </div>
      </div>

      <div class="form-group">
        <label for="weight">Weight</label>
        <div class="input-group">
          <input type="number" id="weight" placeholder="lbs">
          <span>lbs</span>
        </div>
      </div>

      <div class="form-group">
        <label>Sex</label>
        <div class="sex-buttons">
          <button type="button" class="sex-button">Male</button>
          <button type="button" class="sex-button">Female</button>
        </div>
      </div>

      <div class="form-group">
        <label>Conditions</label>
        <a href="filter-conditions.html" class="enter-conditions-button">
          Enter Conditions
        </a>
      </div>
    </form>
  </div>
</body>
</html>
