<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Body</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html">🏠</a>
      <a href="#" onclick="history.back()">←</a>
    </div>
    <h2>My Body</h2>
    <form>
      <div class="form-group">
        <label for="height-ft">Height</label>
        <div class="input-group">
          <input type="number" id="height-ft" placeholder="ft">
          <span>ft</span>
          <input type="number" id="height-in" placeholder="in">
          <span>in</span>
        </div>
      </div>

      <div class="form-group">
        <label for="weight">Weight</label>
        <div class="input-group">
          <input type="number" id="weight" placeholder="lbs">
          <span>lbs</span>
        </div>
      </div>

      <div class="form-group">
        <label>Sex</label>
        <div class="sex-buttons">
          <button type="button" class="sex-button">Male</button>
          <button type="button" class="sex-button">Female</button>
        </div>
      </div>

      <div class="form-group">
        <label>Conditions</label>
        <a href="filter-conditions.html" class="enter-conditions-button">
          Enter Conditions
        </a>
      </div>
    </form>
  </div>
</body>
</html>
