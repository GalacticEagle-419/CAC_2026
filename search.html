<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Ingredients</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --accent: #34d399;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header a {
      font-size: 24px;
      text-decoration: none;
      color: var(--text-dark);
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: #f3f4f6;
      border-radius: 30px;
      padding: 10px 15px;
      margin-bottom: 20px;
    }
    .search-bar input {
      flex-grow: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      outline: none;
      color: var(--text-dark);
    }
    .search-icon {
      font-size: 20px;
      color: var(--text-light);
    }

    .ingredient-list {
      border-top: 1px solid var(--border);
    }
    .ingredient-item {
      display: block;
      padding: 15px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dark);
      text-decoration: none;
      font-size: 16px;
      transition: background 0.2s;
    }
    .ingredient-item:hover {
      background: #f9fafb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html">🏠</a>
      <a href="#" onclick="history.back()">←</a>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search ingredients...">
      <span class="search-icon">🔍</span>
    </div>

    <div class="ingredient-list">
      <a href="ingredient-x.html" class="ingredient-item">Ingredient A</a>
      <a href="ingredient-x.html" class="ingredient-item">Ingredient B</a>
      <a href="ingredient-x.html" class="ingredient-item">Ingredient C</a>
      <a href="ingredient-x.html" class="ingredient-item">Ingredient D</a>
    </div>
  </div>
</body>
</html>
