<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Eating App</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        .app-button {
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #e9e9e9;
            color: #555;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        .app-button:hover {
            background-color: #dcdcdc;
            transform: translateY(-2px);
        }
        .app-button:active {
            background-color: #c0c0c0;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Healthy Eating</h1>
        <div class="button-container">
            <a href="scan.html" class="app-button" id="scan-button">Scan</a>
            <a href="search.html" class="app-button" id="search-button">Search</a>
            <a href="research.html" class="app-button" id="research-button">Research</a>
            <a href="my-body.html" class="app-button" id="my-body-button">My Body</a>
            <a href="about.html" class="app-button" id="about-button">About</a>
        </div>
    </div>
</body>
</html>
