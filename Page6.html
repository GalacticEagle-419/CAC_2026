<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Body</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header a {
            text-decoration: none;
            color: #555;
            font-size: 24px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group input[type="number"] {
            width: 60px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .input-group span {
            color: #555;
        }
        .sex-buttons {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .sex-button {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #e9e9e9;
            color: #555;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        .sex-button.selected {
            background-color: #dcdcdc;
        }
        .sex-button:hover {
            background-color: #dcdcdc;
        }
        .enter-conditions-button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: none;
            border-radius: 8px;
            background-color: #e9e9e9;
            color: #555;
            text-decoration: none;
            margin-top: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        .enter-conditions-button:hover {
            background-color: #dcdcdc;
            transform: translateY(-2px);
        }
        .enter-conditions-button:active {
            background-color: #c0c0c0;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html">🏠</a>
            <a href="#" onclick="history.back()">🔙</a>
        </div>
        <form>
            <div class="form-group">
                <label for="height-ft">Height:</label>
                <div class="input-group">
                    <input type="number" id="height-ft" placeholder="ft">
                    <span>ft</span>
                    <input type="number" id="height-in" placeholder="in">
                    <span>in</span>
                </div>
            </div>
            <div class="form-group">
                <label for="weight">Weight:</label>
                <div class="input-group">
                    <input type="number" id="weight" placeholder="lbs">
                    <span>lbs</span>
                </div>
            </div>
            <div class="form-group">
                <label>Sex:</label>
                <div class="sex-buttons">
                    <button type="button" class="sex-button">Male</button>
                    <button type="button" class="sex-button">Female</button>
                </div>
            </div>
            <div class="form-group">
                <label>Do you have any conditions?</label>
                <a href="filter-conditions.html" class="enter-conditions-button">Enter Conditions</a>
            </div>
        </form>
    </div>
</body>
</html>
