<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overall Health Value</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header a {
            text-decoration: none;
            color: #555;
            font-size: 24px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .health-bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .health-bar-label {
            font-size: 14px;
            color: #888;
            flex-shrink: 0;
            width: 30px;
            text-align: left;
        }
        .health-bar-label.right {
            text-align: right;
            width: 30px;
        }
        .health-bar {
            flex-grow: 1;
            height: 15px;
            background: linear-gradient(to right, #ff4d4d, #ffe680, #80e680);
            border-radius: 8px;
            position: relative;
            margin: 0 10px;
        }
        .health-bar-indicator {
            position: absolute;
            height: 25px;
            width: 5px;
            background-color: #333;
            top: 50%;
            left: 70%; /* Example value, this would be dynamic */
            transform: translate(-50%, -50%);
            border-radius: 2px;
        }
        .breakdown-section {
            text-align: left;
        }
        .breakdown-section h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #333;
        }
        .nutrition-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .nutrition-item p {
            margin: 0;
            width: 60px;
            color: #666;
        }
        .nutrition-bar-container {
            flex-grow: 1;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            position: relative;
        }
        .nutrition-bar {
            height: 100%;
            background-color: #4CAF50; /* Example color, this would be dynamic */
            border-radius: 5px;
            width: 80%; /* Example value, this would be dynamic */
        }
        .important-ingredients-section {
            text-align: left;
            margin-top: 30px;
        }
        .important-ingredients-section h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .ingredient-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .ingredient-item-content {
            flex-grow: 1;
            padding-left: 10px;
            color: #555;
            border-left: 2px solid #ccc;
        }
        .ingredient-icon {
            font-size: 24px;
            color: #ffcc00; /* Example color for a warning */
            margin-right: 10px;
        }
        .expand-button {
            padding: 8px 12px;
            background-color: #e9e9e9;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .expand-button:hover {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html">🏠</a>
            <a href="scan.html">🔙</a>
        </div>
        <h2>Overall Health Value</h2>
        <div class="health-bar-container">
            <span class="health-bar-label">bad</span>
            <div class="health-bar">
                <div class="health-bar-indicator"></div>
            </div>
            <span class="health-bar-label right">good</span>
        </div>

        <div class="breakdown-section">
            <h3>Breakdown:</h3>
            <div class="nutrition-item">
                <p>Protein:</p>
                <div class="nutrition-bar-container">
                    <div class="nutrition-bar" style="width: 70%; background-color: #4CAF50;"></div>
                </div>
            </div>
            <div class="nutrition-item">
                <p>Carbs:</p>
                <div class="nutrition-bar-container">
                    <div class="nutrition-bar" style="width: 40%; background-color: #f44336;"></div>
                </div>
            </div>
            <div class="nutrition-item">
                <p>Fats:</p>
                <div class="nutrition-bar-container">
                    <div class="nutrition-bar" style="width: 90%; background-color: #4CAF50;"></div>
                </div>
            </div>
        </div>

        <div class="important-ingredients-section">
            <h3>Important Ingredients:</h3>
            <div class="ingredient-item">
                <div class="ingredient-icon">⚠️</div>
                <div class="ingredient-item-content">
                    <p> (LLM/DB reason why this is bad) </p>
                </div>
                <a href="ingredient-x.html" class="expand-button">Expand</a>
            </div>
            <div class="ingredient-item">
                <div class="ingredient-icon">⚠️</div>
                <div class="ingredient-item-content">
                    <p> (LLM/DB reason why this is bad) </p>
                </div>
                <a href="ingredient-x.html" class="expand-button">Expand</a>
            </div>
        </div>
    </div>
</body>
</html>
