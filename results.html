<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overall Health Value</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --accent: #34d399;
      --warn: #f59e0b;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header a {
      font-size: 24px;
      text-decoration: none;
      color: var(--text-dark);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-dark);
      font-size: 22px;
    }

    .health-bar-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .health-bar-label {
      font-size: 12px;
      color: var(--text-light);
      flex-shrink: 0;
      width: 30px;
    }
    .health-bar {
      flex-grow: 1;
      height: 16px;
      background: linear-gradient(to right, #f87171, #fbbf24, #34d399);
      border-radius: 8px;
      position: relative;
      margin: 0 10px;
    }
    .health-bar-indicator {
      position: absolute;
      height: 24px;
      width: 4px;
      background-color: var(--text-dark);
      top: 50%;
      left: 70%;
      transform: translate(-50%, -50%);
      border-radius: 2px;
    }

    .breakdown-section {
      margin-top: 20px;
    }
    .breakdown-section h3 {
      margin-bottom: 10px;
      font-size: 18px;
      color: var(--text-dark);
    }
    .nutrition-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .nutrition-item p {
      width: 70px;
      margin: 0;
      font-size: 14px;
      color: var(--text-light);
    }
    .nutrition-bar-container {
      flex-grow: 1;
      height: 10px;
      background: #e5e7eb;
      border-radius: 5px;
      position: relative;
    }
    .nutrition-bar {
      height: 100%;
      border-radius: 5px;
    }

    .important-ingredients-section {
      margin-top: 30px;
    }
    .important-ingredients-section h3 {
      margin-bottom: 10px;
      font-size: 18px;
      color: var(--text-dark);
    }
    .ingredient-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px;
      background: #f9fafb;
      border-radius: 8px;
    }
    .ingredient-icon {
      font-size: 22px;
      margin-right: 10px;
      color: var(--warn);
    }
    .ingredient-item-content {
      flex-grow: 1;
      color: var(--text-dark);
      font-size: 14px;
    }
    .expand-button {
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-dark);
      background: #f3f4f6;
      transition: background 0.2s;
    }
    .expand-button:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html">🏠</a>
      <a href="scan.html">←</a>
    </div>

    <h2>Overall Health Value</h2>

    <div class="health-bar-container">
      <span class="health-bar-label">bad</span>
      <div class="health-bar">
        <div class="health-bar-indicator"></div>
      </div>
      <span class="health-bar-label">good</span>
    </div>

    <div class="breakdown-section">
      <h3>Breakdown</h3>
      <div class="nutrition-item">
        <p>Protein:</p>
        <div class="nutrition-bar-container">
          <div class="nutrition-bar" style="width: 70%; background:#34d399"></div>
        </div>
      </div>
      <div class="nutrition-item">
        <p>Carbs:</p>
        <div class="nutrition-bar-container">
          <div class="nutrition-bar" style="width: 40%; background:#f87171"></div>
        </div>
      </div>
      <div class="nutrition-item">
        <p>Fats:</p>
        <div class="nutrition-bar-container">
          <div class="nutrition-bar" style="width: 90%; background:#34d399"></div>
        </div>
      </div>
    </div>

    <div class="important-ingredients-section">
      <h3>Important Ingredients</h3>
      <div class="ingredient-item">
        <div class="ingredient-icon">⚠️</div>
        <div class="ingredient-item-content">
          (LLM/DB reason why this is bad)
        </div>
        <a href="ingredient-x.html" class="expand-button">Expand</a>
      </div>
      <div class="ingredient-item">
        <div class="ingredient-icon">⚠️</div>
        <div class="ingredient-item-content">
          (LLM/DB reason why this is bad)
        </div>
        <a href="ingredient-x.html" class="expand-button">Expand</a>
      </div>
    </div>
  </div>
</body>
</html>
