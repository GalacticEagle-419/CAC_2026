<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Ingredients</title>
  <style>
    /* === GLOBAL STYLES === */
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #B8DBD9 0%, #EDCDBF 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1E2D2F;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 14px rgba(36, 25, 9, 0.2);
    }

    /* === HEADER === */
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 16px;
    }

    .header a {
      text-decoration: none;
      font-size: 24px;
      color: #568259;
      transition: color 0.2s;
    }
    .header a:hover {
      color: #1E2D2F;
    }

    /* === CAMERA WINDOW === */
    .camera-window {
      width: 100%;
      height: 280px;
      background-color: #1E2D2F;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    /* === INGREDIENTS LIST === */
    .ingredients-list {
      margin-top: 10px;
      background: #F9F9F9;
      padding: 12px 16px;
      border-radius: 10px;
    }

    .ingredients-list h3 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #1E2D2F;
    }

    .ingredients-list p {
      margin: 0;
      font-size: 15px;
      color: #241909;
      line-height: 1.5;
    }

    /* === CONFIRM BUTTON === */
    .confirm-button {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      border: none;
      border-radius: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #568259, #3e6140);
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.25s;
      box-shadow: 0 4px 10px rgba(36, 25, 9, 0.2);
    }

    .confirm-button:hover {
      transform: translateY(-2px);
    }

    .confirm-button:active {
      transform: translateY(0);
      background: #2f4b2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html">🏠</a>
    </div>

    <div class="camera-window">
      <video id="videoElement" autoplay></video>
      <div class="camera-overlay">Scanning...</div>
      <script src="camera.js"></script>
    </div>

    <div class="ingredients-list">
      <h3>Detected Ingredients</h3>
      <p>No ingredients detected yet.</p>
    </div>

    <a href="results.html" class="confirm-button">Confirm ✅</a>
  </div>
</body>
</html>
