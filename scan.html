<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Ingredients</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header a {
            text-decoration: none;
            color: #555;
            font-size: 24px;
        }
        .camera-window {
            width: 100%;
            height: 300px;
            background-color: #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .camera-window-content {
            padding: 20px;
            border: 2px dashed #888;
            text-align: center;
        }
        .camera-window-content h3 {
            margin-top: 0;
            color: #fff;
        }
        .ingredients-list {
            margin-top: 20px;
            text-align: left;
        }
        .ingredients-list h3 {
            margin-bottom: 5px;
            color: #333;
        }
        .ingredients-list p {
            margin: 0;
            color: #666;
            line-height: 1.4;
        }
        .confirm-button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: none;
            border-radius: 8px;
            background-color: #e9e9e9;
            color: #555;
            text-decoration: none;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        .confirm-button:hover {
            background-color: #dcdcdc;
            transform: translateY(-2px);
        }
        .confirm-button:active {
            background-color: #c0c0c0;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html">🏠</a>
        </div>
        <div class="camera-window">
            <div class="camera-window-content">
                <h3>KEY INGREDIENTS</h3>
                <video id="videoElement" autoplay></video>
                <script src="app.js"></script>
            </div>
        </div>
        <div class="ingredients-list">
            <h3>Ingredients:</h3>
            
        </div>
        <a href="results.html" class="confirm-button">Confirm</a>
    </div>
</body>
</html>
